<script>
(function(){
 function show(l){document.querySelectorAll('[data-en]').forEach(function(e){e.hidden=l!=='en'});
  document.querySelectorAll('[data-fr]').forEach(function(e){e.hidden=l!=='fr'});
  document.querySelectorAll('.switch button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===l)});
  document.documentElement.lang=l;try{localStorage.setItem('ff-lang',l)}catch(e){}}
 document.querySelectorAll('.switch button').forEach(function(b){b.onclick=function(){show(b.dataset.l)}});
 var l=null;try{l=localStorage.getItem('ff-lang')}catch(e){}
 if(/[?&]lang=fr/.test(location.search))l='fr'; if(/[?&]lang=en/.test(location.search))l='en';
 if(!l)l=/^fr/i.test(navigator.language)?'fr':'en'; show(l);
})();
</script>
